<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tespit/Tahdit/Tahsis – MİS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div class="d-flex" id="wrapper">
  <div id="mis-sidebar-mount"></div>
  <div id="page-content" class="flex-grow-1">

    <nav class="navbar mis-topbar px-3">
      <button class="btn btn-sm mis-sidebar-toggle" id="sidebarToggle"><i class="bi bi-list fs-5"></i></button>
      <span class="mis-topbar-title">Tespit / Tahdit / Tahsis</span>
      <div class="ms-auto">
        <button class="btn btn-sm btn-mis" onclick="yeniTahsisAc()">
          <i class="bi bi-plus-lg me-1"></i>Yeni 3T Başlat
        </button>
      </div>
    </nav>

    <main class="mis-main p-4">

      <!-- İstatistik kartları -->
      <div class="row g-3 mb-4" id="istat-satirlar">
        <div class="col-6 col-md-3">
          <div class="mis-kart-ozet">
            <div class="baslik">Toplam</div>
            <div class="sayi" id="i-toplam">–</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="mis-kart-ozet" style="border-color:#ffc107">
            <div class="baslik">Devam Eden</div>
            <div class="sayi" id="i-devam">–</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="mis-kart-ozet" style="border-color:#198754">
            <div class="baslik">Tamamlanan</div>
            <div class="sayi" id="i-tamamlandi">–</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="mis-kart-ozet" style="border-color:#6c757d">
            <div class="baslik">Taslak</div>
            <div class="sayi" id="i-taslak">–</div>
          </div>
        </div>
      </div>

      <!-- Filtreler -->
      <div class="mis-card mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-sm-2">
            <label class="form-label small fw-semibold mb-1">Durum</label>
            <select class="form-select form-select-sm" id="f-durum" onchange="loadListe()">
              <option value="">Tümü</option>
              <option value="taslak">Taslak</option>
              <option value="devam">Devam Ediyor</option>
              <option value="tamamlandi">Tamamlandı</option>
              <option value="iptal">İptal</option>
              <option value="reddedildi">Reddedildi</option>
            </select>
          </div>
          <div class="col-sm-3">
            <label class="form-label small fw-semibold mb-1">İl</label>
            <input type="text" class="form-control form-control-sm" id="f-il" placeholder="İl adı..." oninput="debounce(loadListe,400)()"/>
          </div>
          <div class="col-sm-3">
            <label class="form-label small fw-semibold mb-1">Ara</label>
            <input type="text" class="form-control form-control-sm" id="f-ara" placeholder="No, talep sahibi..." oninput="debounce(loadListe,400)()"/>
          </div>
          <div class="col-sm-auto">
            <button class="btn btn-sm btn-outline-secondary" onclick="filtreSifirla()">
              <i class="bi bi-x-circle me-1"></i>Temizle
            </button>
          </div>
        </div>
      </div>

      <!-- Tablo -->
      <div class="mis-card">
        <div class="table-responsive">
          <table class="table table-sm mis-table mb-0">
            <thead>
              <tr>
                <th>Tahsis No</th>
                <th>İl / İlçe / Mahalle</th>
                <th>Talep Sahibi</th>
                <th>Talep Tarihi</th>
                <th>Parsel</th>
                <th>Alan (da)</th>
                <th>Durum</th>
                <th>Tarih</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tablo-body">
              <tr><td colspan="9" class="text-center py-4 text-muted">Yükleniyor...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="d-flex justify-content-between align-items-center p-2 border-top small text-muted" id="sayfalama"></div>
      </div>
    </main>
  </div>
</div>

<!-- Yeni Tahsis Modal -->
<div class="modal fade" id="tahsisModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header mis-modal-header">
        <h5 class="modal-title"><i class="bi bi-clipboard-check me-2"></i>Yeni 3T Çalışması Başlat</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label small fw-semibold">İl *</label>
            <select class="form-select form-select-sm" id="m-il"></select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">İlçe</label>
            <select class="form-select form-select-sm" id="m-ilce" disabled>
              <option value="">Önce il seçin</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold">Mahalle/Köy</label>
            <select class="form-select form-select-sm" id="m-mahalle" disabled>
              <option value="">Önce ilçe seçin</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Talep Sahibi</label>
            <input type="text" class="form-control form-control-sm" id="m-talep-sahibi" placeholder="Kurum/Kişi adı"/>
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-semibold">Talep Tarihi</label>
            <input type="date" class="form-control form-control-sm" id="m-talep-tarihi"/>
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-semibold">Durum</label>
            <select class="form-select form-select-sm" id="m-durum">
              <option value="taslak">Taslak</option>
              <option value="devam">Devam Ediyor</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label small fw-semibold">Tahsis Amacı</label>
            <input type="text" class="form-control form-control-sm" id="m-amac" placeholder="Kullanım amacı (kısa)"/>
          </div>
          <div class="col-12">
            <label class="form-label small fw-semibold">Açıklama</label>
            <textarea class="form-control form-control-sm" id="m-aciklama" rows="2" placeholder="İsteğe bağlı açıklama"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">İptal</button>
        <button class="btn btn-mis btn-sm" onclick="tahsisKaydet()">
          <i class="bi bi-check-lg me-1"></i>Başlat ve Detaya Git
        </button>
      </div>
    </div>
  </div>
</div>

<div id="mis-toast-mount"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/lang.js"></script>
<script src="/js/sidebar.js"></script>
<script>
const API     = '/api/tahsis';
const API_AYAR = '/api/ayarlar';

const DURUM_ETIKET = {
  taslak:     { cls:'bg-secondary',     ad:'Taslak' },
  devam:      { cls:'bg-warning text-dark', ad:'Devam Ediyor' },
  tamamlandi: { cls:'bg-success',        ad:'Tamamlandı' },
  iptal:      { cls:'bg-danger',         ad:'İptal' },
  reddedildi: { cls:'bg-dark',           ad:'Reddedildi' },
};

let sayfa = 1;
const showToast = (msg, tip='success') => {
  const t = document.createElement('div');
  t.className = `toast show align-items-center text-white bg-${tip} border-0 mb-2`;
  t.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
  document.getElementById('mis-toast-mount').appendChild(t);
  setTimeout(() => t.remove(), 3500);
};

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

const loadListe = async () => {
  const params = new URLSearchParams({
    sayfa, limit: 20,
    durum:  document.getElementById('f-durum').value,
    il_ad:  document.getElementById('f-il').value,
    ara:    document.getElementById('f-ara').value,
  });
  const r = await fetch(`${API}?${params}`);
  const j = await r.json();
  const body = document.getElementById('tablo-body');
  if (!j.data?.length) { body.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted small">Kayıt bulunamadı.</td></tr>'; return; }

  body.innerHTML = j.data.map(t => {
    const d = DURUM_ETIKET[t.durum] || { cls:'bg-secondary', ad: t.durum };
    const yer = [t.il_ad, t.ilce_ad, t.mahalle_ad].filter(Boolean).join(' / ');
    return `<tr style="cursor:pointer" onclick="window.location='/tahsis/detay.html?id=${t._id}'">
      <td class="fw-semibold text-success small">${t.tahsis_no||'–'}</td>
      <td class="small">${yer||'–'}</td>
      <td class="small">${t.talep_sahibi||'–'}</td>
      <td class="small">${t.talep_tarihi?new Date(t.talep_tarihi).toLocaleDateString('tr-TR'):'–'}</td>
      <td class="c small">${t.parseller?.length||0}</td>
      <td class="c small">${t.toplam_alan_da?Number(t.toplam_alan_da).toLocaleString('tr-TR',{maximumFractionDigits:2}):'–'}</td>
      <td><span class="badge ${d.cls}">${d.ad}</span></td>
      <td class="small text-muted">${new Date(t.createdAt).toLocaleDateString('tr-TR')}</td>
      <td onclick="event.stopPropagation()">
        <a href="/tahsis/detay.html?id=${t._id}" class="btn btn-xs btn-mis"><i class="bi bi-eye"></i></a>
        <button class="btn btn-xs btn-outline-danger" onclick="tahsisSil('${t._id}')"><i class="bi bi-trash"></i></button>
      </td>
    </tr>`;
  }).join('');

  // Sayfalama
  const topSayfa = Math.ceil(j.total / 20);
  document.getElementById('sayfalama').innerHTML =
    `<span>${j.total} kayıt — Sayfa ${sayfa}/${topSayfa}</span>
     <div class="d-flex gap-1">
       <button class="btn btn-xs btn-outline-secondary" ${sayfa<=1?'disabled':''} onclick="sayfa--;loadListe()">‹</button>
       <button class="btn btn-xs btn-outline-secondary" ${sayfa>=topSayfa?'disabled':''} onclick="sayfa++;loadListe()">›</button>
     </div>`;
};

const loadIstatistik = async () => {
  try {
    const r = await fetch(`${API}/istatistik`);
    const j = await r.json();
    const d = j.data;
    document.getElementById('i-toplam').textContent    = d.toplam || 0;
    document.getElementById('i-devam').textContent     = d.durumlar?.devam || 0;
    document.getElementById('i-tamamlandi').textContent = d.durumlar?.tamamlandi || 0;
    document.getElementById('i-taslak').textContent    = d.durumlar?.taslak || 0;
  } catch(e) {}
};

const filtreSifirla = () => {
  ['f-durum','f-il','f-ara'].forEach(id => document.getElementById(id).value='');
  sayfa=1; loadListe();
};

// İl/İlçe/Mahalle yükleme
const loadIller = async () => {
  const r = await fetch(`${API_AYAR}/idari/iller`);
  const j = await r.json();
  const sel = document.getElementById('m-il');
  sel.innerHTML = '<option value="">— İl seçin —</option>'
    + (j.data||[]).map(il=>`<option value="${il.xml_id}" data-ad="${il.ad}">${il.ad}</option>`).join('');
  sel.addEventListener('change', async () => {
    const id = sel.value;
    const ad = sel.options[sel.selectedIndex]?.getAttribute('data-ad') || '';
    sel._ad = ad;
    const mi = document.getElementById('m-ilce');
    mi.innerHTML = '<option value="">— İlçe seçin —</option>'; mi.disabled = !id;
    document.getElementById('m-mahalle').innerHTML = '<option value="">— Mahalle seçin —</option>';
    document.getElementById('m-mahalle').disabled = true;
    if (!id) return;
    const r2 = await fetch(`${API_AYAR}/idari/ilceler/${id}`);
    const j2 = await r2.json();
    mi.innerHTML = '<option value="">— İlçe seçin —</option>'
      + (j2.data||[]).map(i=>`<option value="${i.xml_id}" data-ad="${i.ad}">${i.ad}</option>`).join('');
    mi.addEventListener('change', async () => {
      const id2 = mi.value;
      const mah = document.getElementById('m-mahalle');
      mah.innerHTML = '<option value="">— Mahalle seçin —</option>'; mah.disabled = !id2;
      if (!id2) return;
      const r3 = await fetch(`${API_AYAR}/idari/mahalleler/${id2}`);
      const j3 = await r3.json();
      mah.innerHTML = '<option value="">— Mahalle seçin —</option>'
        + (j3.data||[]).map(m=>`<option value="${m.xml_id}" data-ad="${m.ad}">${m.ad}</option>`).join('');
      mah.disabled = false;
    }, {once:true});
    mi.disabled = false;
  }, {once:true});
};

window.yeniTahsisAc = async () => {
  await loadIller();
  new bootstrap.Modal(document.getElementById('tahsisModal')).show();
};

window.tahsisKaydet = async () => {
  const ilSel  = document.getElementById('m-il');
  const ilcSel = document.getElementById('m-ilce');
  const mahSel = document.getElementById('m-mahalle');
  const il_ad  = ilSel.options[ilSel.selectedIndex]?.getAttribute('data-ad') || '';
  if (!il_ad) { showToast('İl seçimi zorunlu.','warning'); return; }
  const veri = {
    il_ad,
    ilce_ad:    ilcSel.options[ilcSel.selectedIndex]?.getAttribute('data-ad') || '',
    mahalle_ad: mahSel.options[mahSel.selectedIndex]?.getAttribute('data-ad') || '',
    talep_sahibi:  document.getElementById('m-talep-sahibi').value,
    talep_tarihi:  document.getElementById('m-talep-tarihi').value || null,
    talep_amaci:   document.getElementById('m-amac').value,
    durum:         document.getElementById('m-durum').value,
    aciklama:      document.getElementById('m-aciklama').value,
  };
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(veri) });
  const j = await r.json();
  if (j.success) {
    bootstrap.Modal.getInstance(document.getElementById('tahsisModal')).hide();
    window.location.href = `/tahsis/detay.html?id=${j.data._id}`;
  } else showToast(j.message||'Hata.','danger');
};

window.tahsisSil = async (id) => {
  if (!confirm('Bu tahsis kaydını silmek istiyor musunuz?')) return;
  const r = await fetch(`${API}/${id}`, { method:'DELETE' });
  const j = await r.json();
  if (j.success) { showToast('Silindi.'); loadListe(); loadIstatistik(); }
  else showToast(j.message,'danger');
};

loadListe();
loadIstatistik();
</script>
</body>
</html>
